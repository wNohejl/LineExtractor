# The hosted desk: one VM, four containers, one published pair of ports. See ADR 0019 and
# deploy/README.md; the plan behind it is docs/superpowers/specs/2026-09-27-going-public-plan.md.
#
#   Internet :443 ─► caddy ─► web :8080 (the desk, no scheduler)
#                                 │
#                        worker (the only scheduler and evaluator)
#                                 │
#                             postgres ◄── backup (nightly pg_dump, 14 days kept)
#
# How this differs from the laptop's docker-compose.yml, and why:
#
#   * Caddy terminates TLS with a real certificate and publishes 80 and 443. Nothing else
#     publishes anything: web, worker and postgres are reachable only on the compose network.
#     That is what makes web's plain-HTTP listener safe and its trust of Caddy's forwarded
#     headers correct (Hosting__BehindProxy) — nothing but Caddy can reach it.
#   * Images come from GHCR, built by .github/workflows/images.yml, not built on the server.
#   * The worker always runs, and it is the only process that schedules or evaluates. Two
#     schedulers spend the metered odds credits twice.
#   * The desk is gated (ADR 0018): a code to get in; the operator's opens everything.
#
# Everything secret comes from ./.env beside this file (see .env.example). Deploy with
# ./deploy.sh; roll back with IMAGE_TAG=sha-<commit> ./deploy.sh.

# Not "lineops": that is the project name the laptop's docker-compose.yml gets from its directory,
# and sharing it would make one stack's containers orphans of the other (deploy.sh removes orphans).
name: lineops-hosted

x-logging: &logging
  # A noisy week must not fill the disk: three 10 MB files per container, then rotation.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  read_only: true
  tmpfs:
    - /tmp

x-database: &database
  ConnectionStrings__LineOps: "Host=postgres;Port=5432;Database=lineops;Username=lineops;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env};SSL Mode=Disable"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      LINEOPS_HOST: ${LINEOPS_HOST:?set LINEOPS_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    <<: *hardening
    # Caddy runs as root in its image and needs only to bind 80 and 443.
    cap_add: [NET_BIND_SERVICE]
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *logging

  web:
    image: ghcr.io/${GHCR_OWNER:-wnohejl}/lineops-web:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database
      ASPNETCORE_ENVIRONMENT: Production
      # Plain HTTP on the compose network only; no port is published. Caddy holds the certificate.
      ASPNETCORE_URLS: "http://+:8080"
      Hosting__BehindProxy: "true"
      AllowedHosts: ${LINEOPS_HOST:?set LINEOPS_HOST in .env}
      DataProtection__KeyPath: /keys

      # The worker schedules and evaluates; this process only serves the desk.
      Ingestion__HostScheduler: "false"
      Reliability__HostEvaluator: "false"

      # Who may reach the desk (ADR 0018). Codes are made by scripts/new-access-code.ps1.
      Access__Mode: Gated
      Access__OperatorCodeHash: ${ACCESS_OPERATOR_CODE_HASH:?make one with scripts/new-access-code.ps1}
      Access__GuestCodeHash: ${ACCESS_GUEST_CODE_HASH:-}
      Access__AllowAnonymousVisitors: ${ACCESS_ALLOW_ANONYMOUS:-false}

      # The pull menu calls the providers from the web process, so it needs the keys too.
      Ingestion__TheOddsApi__ApiKey: ${THE_ODDS_API_KEY:-}
      Ingestion__TheOddsApi__Enabled: ${THE_ODDS_API_ENABLED:-false}
      Ingestion__OddsApiIo__ApiKey: ${ODDS_API_IO_KEY:-}
      Ingestion__BallDontLie__ApiKey: ${BALLDONTLIE_KEY:-}
    volumes:
      - web-keys:/keys
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  worker:
    image: ghcr.io/${GHCR_OWNER:-wnohejl}/lineops-worker:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database
      DOTNET_ENVIRONMENT: Production
      Ingestion__TheOddsApi__ApiKey: ${THE_ODDS_API_KEY:-}
      Ingestion__TheOddsApi__Enabled: ${THE_ODDS_API_ENABLED:-false}
      Ingestion__OddsApiIo__ApiKey: ${ODDS_API_IO_KEY:-}
      Ingestion__BallDontLie__ApiKey: ${BALLDONTLIE_KEY:-}
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 384M
    logging: *logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lineops
      POSTGRES_USER: lineops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineops -d lineops"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    tmpfs:
      - /tmp
      - /run
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  # Nightly, then every 24 hours: a custom-format dump into ./backups, the last 14 kept.
  # Copying them off the box is the host's job (README: "Backups"); a backup that lives only
  # beside the database it protects is not one.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: lineops
      PGDATABASE: lineops
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

volumes:
  pgdata:
  web-keys:
  caddy-data:
  caddy-config:
